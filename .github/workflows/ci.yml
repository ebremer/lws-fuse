name: lws-fuse

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # jnr-fuse loads libfuse when LWSFileSystem is constructed; without it LWSFileSystemTest is skipped.
      - name: Install libfuse2
        run: sudo apt-get update && sudo apt-get install -y libfuse2t64
      - name: Build and test
        run: mvn -B verify
